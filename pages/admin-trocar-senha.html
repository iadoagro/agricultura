<body>
<header class="cab-padrao"><h1>SISTEMA</h1><p id="trocaSubtitulo">Trocar senha</p></header>
<main class="admin-auth">
  <div class="admin-card">
    <form id="formTrocar">
      <p class="admin-desc" id="trocaTexto">Sua conta foi cadastrada com uma senha temporária. Escolha uma nova senha para continuar.</p>
      <label for="senha1" id="rotuloSenha1">Nova senha</label>
      <input id="senha1" type="password" autocomplete="new-password" required>
      <label for="senha2" id="rotuloSenha2">Confirmar nova senha</label>
      <input id="senha2" type="password" autocomplete="new-password" required>
      <button class="admin-submit" type="submit" id="trocaBotao">Trocar senha</button>
    </form>
    <p class="admin-msg" id="adminMsg" role="status"></p>
  </div>
</main>
<script src="../js/admin-trocar-senha.js?v=2026092402"></script>
