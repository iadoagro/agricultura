// Os setores, responsáveis e portarias vêm do organograma (js/contatos-organograma.js): trocas, inclusões e remoções
// feitas lá aparecem aqui sozinhas. Só os PDFs (portariasPDFMap) continuam listados nesta página.
let portariasDados = [];
function dadosDoOrganograma(dados) {
  return dados.nos.map(n => {
    const linhas = String(n.holder || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    return {titulo: n.title.replace(/\s+/g, ' '), pessoa: linhas[0] || '', portaria: linhas.slice(1).join(' ')};
  });
}

const portariasPDFNorm = {};
Object.keys(portariasPDFMap).forEach(k => { const m = k.match(/^0*(\d+)\/(\d{4})$/); if (m) portariasPDFNorm[`${m[1]}/${m[2]}`] = portariasPDFMap[k]; });

function getPortariaKey(portariaStr) {
  const match = portariaStr.match(/(\d+)\/(\d{4})/);
  if (!match) return null;
  const n = String(Number(match[1]));
  return portariasPDFNorm[`${n}/${match[2]}`] ? `${n}/${match[2]}` : null;
}

function getPreposicao(titulo) {
  const femininos = ['diretoria','divisão','consultoria','assessoria','ouvidoria','secretária'];
  const lower = titulo.toLowerCase();
  for (const f of femininos) {
    if (lower.startsWith(f)) return 'da';
  }
  return 'do';
}

function getCargoLabel(titulo, pessoa) {
  const lower = titulo.toLowerCase();
  if (lower.startsWith('secretária') || lower.startsWith('secretário')) return titulo;
  if (lower.startsWith('diretoria')) {
    const nomeSetor = titulo.replace(/^Diretoria\s+/i, '');
    return `Diretor(a) ${nomeSetor}`;
  }
  const prep = getPreposicao(titulo);
  return `Chefe ${prep} ${titulo}`;
}

function renderPortarias() {
  const container = document.getElementById('setoresContainer');
  container.innerHTML = '';

  portariasDados.forEach(p => {
    const card = document.createElement('div');
    card.className = 'portaria-card';

    const key = getPortariaKey(p.portaria);
    const pdfPath = key ? portariasPDFNorm[key] : null;

    const linkHTML = pdfPath
      ? `<a href="${pdfPath}" download class="portaria-link has-pdf" title="Baixar PDF">⬇ Download</a>`
      : `<span class="portaria-link no-pdf" title="Em breve">Aguardando anexo</span>`;

    card.innerHTML = `
      <div class="card-setor">
        <h2>${p.titulo}</h2>
      </div>
      <div class="card-body">
        <p class="chefe-nome">${p.pessoa || 'Sem responsável'}</p>
        <p class="chefe-cargo">${getCargoLabel(p.titulo)}</p>
        <p class="portaria-num">${p.portaria}</p>
        ${linkHTML}
      </div>
    `;
    container.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll('.portaria-card').forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = term === '' || text.includes(term) ? '' : 'none';
  });
});

const setoresContainer = document.getElementById('setoresContainer');
const gridViewBtn = document.getElementById('gridViewBtn');
const listViewBtn = document.getElementById('listViewBtn');
const listHeader = document.getElementById('listHeader');

function updateListViewClasses() {
  const cards = document.querySelectorAll('.portaria-card');
  cards.forEach(card => {
    const cardSetor = card.querySelector('.card-setor');
    const cardBody = card.querySelector('.card-body');
    if (setoresContainer.classList.contains('list-view')) {
      card.classList.add('list-view');
      cardSetor.classList.add('list-view');
      cardBody.classList.add('list-view');
      listHeader.style.display = '';
    } else {
      card.classList.remove('list-view');
      cardSetor.classList.remove('list-view');
      cardBody.classList.remove('list-view');
      listHeader.style.display = 'none';
    }
  });
}

function aplicarOrganograma(dados) {
  portariasDados = dadosDoOrganograma(dados);
  renderPortarias();
  updateListViewClasses();
  document.getElementById('searchInput').dispatchEvent(new Event('input'));
}
// Abre com a última leitura guardada e confere com o banco; volta a conferir ao voltar para esta aba
const lidoOrg = OrgContatos.doCache();
if (lidoOrg) aplicarOrganograma(lidoOrg);
function atualizarOrganograma() {
  OrgContatos.carregar().then(r => { if (r.mudou || !lidoOrg) aplicarOrganograma(r.dados); }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizarOrganograma(); });

// Inicializar com modo lista como padrão
setoresContainer.classList.add('list-view');
updateListViewClasses();

gridViewBtn.addEventListener('click', () => {
  setoresContainer.classList.remove('list-view');
  gridViewBtn.classList.add('active');
  listViewBtn.classList.remove('active');
  updateListViewClasses();
});

listViewBtn.addEventListener('click', () => {
  setoresContainer.classList.add('list-view');
  listViewBtn.classList.add('active');
  gridViewBtn.classList.remove('active');
  updateListViewClasses();
});
atualizarOrganograma();
