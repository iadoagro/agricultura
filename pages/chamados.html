<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamados | Fila de atendimento</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="../js/banco-config.js?v=2026091406"></script>
<script src="../js/admin-auth.js?v=2026091404"></script>
<script src="../js/admin-gate.js?v=2026091402"></script>
<meta property="og:title" content="Chamados">
<meta property="og:description" content="Fila de atendimento de chamados da equipe de Tecnologia da Informação.">
<link rel="stylesheet" href="../css/base.css?v=2026091501">
<link rel="stylesheet" href="../css/chamados-comum.css?v=2026091930">
<link rel="stylesheet" href="../css/chamados.css?v=2026091930">
<link rel="stylesheet" href="../css/motion-ui.css?v=2026091904">
<link rel="stylesheet" href="../css/ui-upgrade.css?v=2026092007">
</head>
<body class="ch-fila-pagina">
<header class="ch-cab">
  <a class="voltar-btn" href="index.html">&#8592; In&iacute;cio</a>
  <h1>Central de Chamados</h1>
  <p>Fila de atendimento · Tecnologia da Informação</p>
</header>

<main class="ch-fila">
  <div class="ch-faixa-demo" id="faixaDemo" hidden>
    <b>Modo demonstração.</b> O banco de dados ainda não está configurado: os chamados ficam salvos só neste navegador.
    <button class="ch-btn pequeno" type="button" id="btnDemo">Criar chamados de exemplo</button>
  </div>

  <section class="ch-kpis" id="kpis" aria-label="Resumo da fila"></section>

  <section class="ch-barra" aria-label="Filtros">
    <div class="ch-busca-fila">
      <span id="icoBusca"></span>
      <input id="busca" type="search" placeholder="Buscar por assunto, código, nome ou setor…" autocomplete="off" aria-label="Buscar chamados">
    </div>
    <div class="ch-seg" id="segStatus" role="group" aria-label="Situação">
      <button type="button" data-v="ativos" class="on">Em aberto</button>
      <button type="button" data-v="resolvidos">Encerrados</button>
      <button type="button" data-v="todos">Todos</button>
    </div>
    <select id="fPrioridade" aria-label="Prioridade"><option value="">Toda prioridade</option></select>
    <select id="fCategoria" aria-label="Categoria"><option value="">Toda categoria</option></select>
    <select id="fDiretoria" aria-label="Diretoria"><option value="">Toda diretoria</option></select>
    <select id="fResp" aria-label="Responsável">
      <option value="">Qualquer responsável</option>
      <option value="__meus">Atribuídos a mim</option>
      <option value="__sem">Sem responsável</option>
    </select>
    <select id="fOrdem" aria-label="Ordem">
      <option value="urgencia">Mais urgentes</option>
      <option value="recentes">Mais recentes</option>
      <option value="antigos">Mais antigos</option>
    </select>
    <div class="ch-seg icones" id="segVisao" role="group" aria-label="Visualização">
      <button type="button" data-v="lista" class="on" aria-label="Lista" data-tip="Lista"></button>
      <button type="button" data-v="quadro" aria-label="Quadro" data-tip="Quadro por situação"></button>
    </div>
    <button class="ch-btn pequeno" type="button" id="btnAtualizar"></button>
    <button class="ch-btn pequeno" type="button" id="btnCsv"></button>
    <button class="ch-btn pequeno" type="button" id="btnLinks"></button>
    <a class="ch-btn pequeno" href="cadastros-chamados.html" id="btnCadastros"></a>
  </section>
  <p class="ch-status-fila" id="statusFila" role="status"></p>

  <section id="area" aria-live="polite"></section>
</main>

<div class="ch-fundo" id="fundo" hidden></div>
<aside class="ch-gaveta" id="gaveta" aria-hidden="true" aria-label="Detalhe do chamado" tabindex="-1"></aside>

<script src="../js/chamados-dados.js?v=2026091930"></script>
<script src="../js/chamados-ui.js?v=2026091930"></script>
<script src="../js/chamados-fila.js?v=2026091930"></script>
<script src="../js/motion-ui.js?v=2026091904"></script>
<script src="../js/motion-extras.js?v=2026092001"></script>
</body>
</html>
