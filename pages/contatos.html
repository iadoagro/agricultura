<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:type" content="website">

<body>
<header class="cab-padrao"><h1>SISTEMA</h1><p>Contatos <span class="header-stats" id="statsLabel"></span></p></header>
<div class="contatos-grade">
<div class="controles">
  <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou setor..." autocomplete="off">
  <div class="filtros" id="filtros"><button class="filtro-btn ativo" data-grupo="" type="button">Todos</button></div>
</div>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<div class="qr-modal-backdrop" id="qrBackdrop">
  <div class="qr-modal">
    <div class="qr-modal-nome" id="qrNome"></div>
    <div class="qr-modal-setor" id="qrSetor"></div>
    <div class="qr-modal-canvas" id="qrCanvas"></div>
    <div class="qr-modal-hint">Aponte a câmera para abrir o WhatsApp</div>
    <button class="qr-modal-close" id="qrClose">Fechar</button>
  </div>
</div>

<script>
const LS_KEY='seagri_contatos';
const API_SAVE='../salvar_contatos.php';
const API_READ='../data/contatos.json';
const PENCIL_ICON='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>';

function loadLocal(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch(e){return{}}}
function mirrorLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(contatos))}catch(e){}}

// Salva via PHP (só funciona em servidor local com XAMPP)
function salvarServidor(id,tel){
  return fetch(API_SAVE,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id,telefone:tel})
  }).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}

// QR Code
const qrBackdrop=document.getElementById('qrBackdrop');
document.getElementById('qrClose').addEventListener('click',()=>qrBackdrop.classList.remove('show'));
qrBackdrop.addEventListener('click',e=>{if(e.target===qrBackdrop)qrBackdrop.classList.remove('show');});

function showQR(n,tel){
  const waUrl=formatWA(tel);
  if(!waUrl)return;
  document.getElementById('qrNome').textContent=nomeDe(n)||n.title;
  document.getElementById('qrSetor').textContent=n.title;
  const canvas=document.getElementById('qrCanvas');
  canvas.innerHTML='';
  const qr=qrcode(0,'M');
  qr.addData(waUrl);
  qr.make();
  const img=document.createElement('div');
  img.innerHTML=qr.createSvgTag({cellSize:5,margin:2});
  img.firstChild.style.borderRadius='8px';
  canvas.appendChild(img);
  qrBackdrop.classList.add('show');
}

function formatWA(tel){
  const d=tel.replace(/\D/g,'');
  if(!d)return null;
  return'https://wa.me/'+(d.startsWith('55')&&d.length>=12?d:'55'+d);
}

function formatDisplay(tel){
  const d=tel.replace(/\D/g,'');
  if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return tel;
}

let grupoAtivo='',buscaAtiva='';
let contatos=loadLocal();

// As caixas são as do organograma (js/contatos-organograma.js): mesmos setores, nomes, cores e hierarquia,
// com as trocas, inclusões e remoções feitas lá. Vêm do banco a cada abertura e quando a página volta a ser vista.
let ORG={nos:[],grupos:[]};
let orgFalhou=false,orgBuscando=false,orgUltima=0,orgPendente=null;

function linhasDe(n){return String(n.holder||'').split('\n').map(s=>s.trim()).filter(Boolean)}
function nomeDe(n){return linhasDe(n)[0]||''}
function atoDe(n){return linhasDe(n).slice(1).join('\n')}
/** Telefone salvo nesta página; na falta dele, o que foi digitado no organograma (modo Admin). */
function telefoneDe(n){return contatos[n.id]||n.telefone||''}
function semAcento(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}

function atualizarStats(){
  const total=ORG.nos.length;
  const preenchidos=ORG.nos.filter(n=>telefoneDe(n)).length;
  document.getElementById('statsLabel').textContent=total?preenchidos+' de '+total+' com telefone':'';
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;clearTimeout(toastTimer);
  t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

function renderCard(n){
  const card=document.createElement('div');
  card.className='card-contato';
  card.dataset.id=n.id;
  const cor=OrgContatos.corDaCaixa(n);

  // a caixa do organograma: cabeçalho colorido com o setor e a sigla; corpo com o responsável e o ato
  const topo=document.createElement('div');topo.className='card-topo';
  topo.style.setProperty('--cc-bg',cor.bg);topo.style.setProperty('--cc-fg',cor.fg);
  const titulo=document.createElement('span');titulo.className='card-titulo';titulo.textContent=n.title.replace(/\s+/g,' ');
  const sigla=document.createElement('span');sigla.className='card-sigla';sigla.textContent=n.sigla;
  topo.append(titulo,sigla);

  const corpo=document.createElement('div');corpo.className='card-corpo';
  if(cor.corpo)corpo.style.setProperty('--cc-corpo',cor.corpo);
  const quem=nomeDe(n);
  const nome=document.createElement('div');nome.className='card-nome'+(quem?'':' vazio');
  nome.textContent=quem||'Sem responsável';
  corpo.appendChild(nome);
  const ato=atoDe(n);
  if(ato){const a=document.createElement('div');a.className='card-ato';a.textContent=ato;corpo.appendChild(a);}

  const campo=document.createElement('div');campo.className='campo-tel';
  const inp=document.createElement('input');
  inp.type='tel';inp.className='input-tel';inp.placeholder='(68) 9XXXX-XXXX';
  inp.setAttribute('aria-label','Telefone — '+(quem||n.title));

  const btnSalvar=document.createElement('button');
  btnSalvar.type='button';btnSalvar.className='btn-salvar';btnSalvar.textContent='Salvar';

  const btnEditar=document.createElement('button');
  btnEditar.type='button';btnEditar.className='btn-editar';btnEditar.title='Editar';
  btnEditar.setAttribute('aria-label','Editar');btnEditar.innerHTML=PENCIL_ICON;

  const wa=document.createElement('a');
  wa.className='btn-wa';wa.textContent='WhatsApp';wa.target='_blank';wa.rel='noopener';

  const btnQR=document.createElement('button');
  btnQR.type='button';btnQR.className='btn-qr';btnQR.title='Gerar QR Code';
  btnQR.textContent='⬛';btnQR.classList.add('oculto');

  // Modo VISUALIZAÇÃO: input travado, mostra lápis + WhatsApp (se houver número)
  function modoVisual(){
    const tel=telefoneDe(n);
    inp.value=tel?formatDisplay(tel):'';
    inp.disabled=true;inp.classList.add('locked');
    inp.classList.toggle('salvo',!!tel);
    btnSalvar.classList.add('oculto');
    if(tel){
      btnEditar.classList.remove('oculto');
      wa.href=formatWA(tel);wa.classList.remove('oculto');
      btnQR.classList.remove('oculto');
    }else{
      btnQR.classList.add('oculto');
      modoEdicao(false);
    }
  }

  function modoEdicao(foco){
    inp.disabled=false;inp.classList.remove('locked');
    btnSalvar.classList.remove('oculto');
    btnEditar.classList.add('oculto');
    wa.classList.add('oculto');
    btnQR.classList.add('oculto');
    if(foco)setTimeout(()=>inp.focus(),0);
  }

  btnQR.addEventListener('click',()=>{const tel=telefoneDe(n);if(tel)showQR(n,tel);});

  btnEditar.addEventListener('click',()=>modoEdicao(true));

  function salvar(){
    const v=inp.value.trim();
    const digitos=v?v.replace(/\D/g,''):'';
    btnSalvar.disabled=true;btnSalvar.textContent='Salvando...';
    salvarServidor(n.id,digitos).then(res=>{
      if(res&&res.ok){
        if(digitos)contatos[n.id]=digitos;else delete contatos[n.id];
        mirrorLocal();atualizarStats();
        showToast(digitos?'Telefone salvo!':'Telefone removido');
        modoVisual();
      }else{
        showToast('Erro ao salvar: '+((res&&res.erro)||'tente novamente'));
      }
    }).catch(()=>{
      // PHP indisponível (ex: GitHub Pages) — salva apenas localmente
      if(digitos)contatos[n.id]=digitos;else delete contatos[n.id];
      mirrorLocal();atualizarStats();
      showToast(digitos?'Salvo localmente (sem servidor)':'Removido localmente');
      modoVisual();
    }).finally(()=>{
      btnSalvar.disabled=false;btnSalvar.textContent='Salvar';
      aplicarPendente();
    });
  }

  btnSalvar.addEventListener('click',salvar);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();salvar();}});

  campo.appendChild(inp);campo.appendChild(btnSalvar);campo.appendChild(btnEditar);campo.appendChild(wa);campo.appendChild(btnQR);
  corpo.appendChild(campo);
  card.append(topo,corpo);

  // Estado inicial conforme já exista telefone salvo
  if(telefoneDe(n))modoVisual();else modoEdicao(false);
  return card;
}

// Hierarquia igual ao organograma: diretoria › departamento › divisão › núcleo
const KIND_ORDER=['secretaria','secretaria-adjunta','assessoria','comissao','diretoria','departamento','divisao','nucleo','escritorio'];
const KIND_LABEL={
  'secretaria':'Secretaria',
  'secretaria-adjunta':'Secretaria Adjunta',
  'assessoria':'Assessorias',
  'comissao':'Comissões',
  'diretoria':'Diretoria',
  'departamento':'Departamentos',
  'divisao':'Divisões',
  'nucleo':'Núcleos',
  'escritorio':'Escritórios Locais'
};
function ordemTipo(k){const i=KIND_ORDER.indexOf(k);return i<0?KIND_ORDER.length:i}
function rotuloGrupo(g){return g==='Escritórios Locais'?'Escritórios':g}

function casa(n,q){
  if(!q)return true;
  return semAcento(nomeDe(n)).includes(q)||semAcento(n.title).includes(q)||semAcento(n.sigla).includes(q);
}

function render(){
  const main=document.getElementById('main');
  main.innerHTML='';
  if(!ORG.nos.length){
    const s=document.createElement('div');s.className='sem-resultado';
    s.textContent=orgFalhou?'Não foi possível carregar os contatos do organograma. Recarregue a página.':'Carregando contatos do organograma…';
    main.appendChild(s);
    atualizarStats();
    return;
  }
  const q=semAcento(buscaAtiva.trim());
  let totalVisiveis=0;

  ORG.grupos.forEach(g=>{
    if(grupoAtivo&&grupoAtivo!==g.nome)return;
    const lista=ORG.nos.filter(n=>n.grupo===g.nome&&casa(n,q));
    if(!lista.length)return;
    totalVisiveis+=lista.length;

    const secao=document.createElement('div');secao.className='grupo-secao';
    const titulo=document.createElement('div');titulo.className='grupo-titulo';
    const cg=g.cabeca?OrgContatos.corDaCaixa(g.cabeca):{bg:'#475569',fg:'#fff'};
    titulo.style.setProperty('--gt-bg',cg.bg);titulo.style.setProperty('--gt-fg',cg.fg);
    titulo.textContent=rotuloGrupo(g.nome)+' ('+lista.length+')';
    secao.appendChild(titulo);

    // Separa por tipo (diretoria/departamento/divisão/núcleo), como no organograma
    const tipos=[...new Set(lista.map(n=>n.kind))].sort((a,b)=>ordemTipo(a)-ordemTipo(b));
    tipos.forEach(kind=>{
      const doTipo=lista.filter(n=>n.kind===kind);
      // Só mostra o rótulo do tipo quando o grupo tem mais de um tipo
      if(tipos.length>1){
        const sub=document.createElement('div');sub.className='subgrupo-titulo';
        sub.textContent=(KIND_LABEL[kind]||kind)+' ('+doTipo.length+')';
        secao.appendChild(sub);
      }
      const grid=document.createElement('div');grid.className='cards-grid';
      doTipo.forEach(n=>grid.appendChild(renderCard(n)));
      secao.appendChild(grid);
    });

    main.appendChild(secao);
  });

  if(!totalVisiveis){
    const s=document.createElement('div');s.className='sem-resultado';
    s.textContent='Nenhum contato encontrado.';main.appendChild(s);
  }
  atualizarStats();
}

/** Botões dos grupos: Todos + um por seção do organograma (se entrar ou sair uma diretoria, muda sozinho). */
function montarFiltros(){
  const box=document.getElementById('filtros');
  const nomes=['',...ORG.grupos.map(g=>g.nome)];
  if(!nomes.includes(grupoAtivo))grupoAtivo='';   // o grupo escolhido deixou de existir no organograma
  box.innerHTML='';
  nomes.forEach(nome=>{
    const b=document.createElement('button');
    b.type='button';b.className='filtro-btn'+(nome===grupoAtivo?' ativo':'');
    b.dataset.grupo=nome;b.textContent=nome?rotuloGrupo(nome):'Todos';
    b.addEventListener('click',()=>{
      box.querySelectorAll('.filtro-btn').forEach(x=>x.classList.toggle('ativo',x===b));
      grupoAtivo=nome;
      render();
    });
    box.appendChild(b);
  });
}

document.getElementById('busca').addEventListener('input',e=>{buscaAtiva=e.target.value;render()});

function aplicarOrg(dados){
  ORG=dados;orgPendente=null;
  montarFiltros();render();
}
/** Telefone digitado e ainda não salvo: não dá para redesenhar a lista por cima dele. */
function editandoAlgum(){
  return [...document.querySelectorAll('.input-tel')].some(i=>!i.disabled&&i.value.trim()!=='');
}
function aplicarPendente(){
  if(orgPendente&&!editandoAlgum())aplicarOrg(orgPendente);
}
function atualizarOrg(){
  if(orgBuscando)return;
  orgBuscando=true;orgUltima=Date.now();
  OrgContatos.carregar().then(res=>{
    orgFalhou=false;
    if(res.mudou||!ORG.nos.length){
      if(editandoAlgum())orgPendente=res.dados;   // entra assim que o telefone for salvo ou a página voltar a ser vista
      else aplicarOrg(res.dados);
    }
  }).catch(()=>{
    // sem conexão: segue com a última leitura guardada; sem ela, avisa
    if(!ORG.nos.length){orgFalhou=true;render();}
  }).finally(()=>{orgBuscando=false;});
}
// quem troca um nome no organograma e volta para esta aba vê a mudança sem recarregar
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  aplicarPendente();
  if(Date.now()-orgUltima>20000)atualizarOrg();
});

// Abre com a última leitura guardada (se houver) e confere com o banco; telefones vêm do contatos.json
const lido=OrgContatos.doCache();
if(lido)ORG=lido;
montarFiltros();
render();
atualizarOrg();
fetch(API_READ,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&typeof d==='object'&&Object.keys(d).length>0){
    contatos=d;mirrorLocal();render();
  }
}).catch(()=>{/* mantém dados do localStorage */});
</script>
<script src="../js/motion-ui.js?v=2026091904"></script>
<script src="../js/motion-extras.js?v=2026100901"></script>

</body>
