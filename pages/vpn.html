<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN | SISTEMA</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="../js/banco-config.js?v=2026091406"></script>
<script src="../js/ambiente-cliente.js?v=2026092302"></script>
<script src="../js/admin-auth.js?v=2026102001"></script>
<script src="../js/admin-gate.js?v=2026102101"></script>
<script src="../js/rastreio.js?v=2026092530"></script>
<script src="../js/nav.js?v=2026102101"></script>
<link rel="stylesheet" href="../css/base.css?v=2026091501">
<link rel="stylesheet" href="../css/motion-ui.css?v=2026091904">
<link rel="stylesheet" href="../css/ui-upgrade.css?v=2026100901">
<link rel="stylesheet" href="../css/fx-ui.css?v=2026100901">
<link rel="stylesheet" href="../css/nav.css?v=2026101201">
<link rel="stylesheet" href="../css/padrao.css?v=2026101701">
<link rel="stylesheet" href="../css/vpn.css?v=2026102115">
</head>
<body class="vpn-equipe">
<header class="cab-padrao"><h1>SISTEMA</h1><p>VPN</p></header>

<main class="vpn-main">
  <section class="vpn-link" aria-label="Link público do formulário">
    <span>Link público do formulário (não precisa de login):</span>
    <input type="text" id="vpnLink" readonly aria-label="Link público">
    <button type="button" class="vpn-btn" id="vpnCopiar">Copiar link</button>
  </section>
  <section class="vpn-link" id="vpnLinkLocalBox" aria-label="Link local do formulário" hidden>
    <span>Link local, só para testar (visível só ao responsável):</span>
    <input type="text" id="vpnLinkLocal" readonly aria-label="Link local">
    <a class="vpn-btn" id="vpnAbrirLocal" href="#" target="_blank" rel="noopener">Abrir</a>
  </section>

  <div class="vpn-barra">
    <span class="vpn-atualiza" id="vpnAtualiza" role="status" aria-live="off">Aguardando carregar…</span>
    <input type="search" id="vpnBusca" placeholder="Buscar por nome, CPF, matrícula, e-mail ou setor" aria-label="Buscar">
    <select id="vpnFiltro" aria-label="Situação">
      <option value="">Todas as situações</option>
      <option value="pendente">Pendentes</option>
      <option value="atendida">Atendidas</option>
      <option value="recusada">Recusadas</option>
    </select>
  </div>

  <div class="vpn-tab-wrap">
    <table class="vpn-tab">
      <thead><tr><th>Nº</th><th>Recebida em</th><th>Nome</th><th>CPF</th><th>RG</th><th>Nascimento</th><th>E-mail funcional</th><th>WhatsApp</th><th>Vínculo</th><th>Matrícula</th><th>Setor</th><th>Observações</th><th>Situação</th><th>Ações</th></tr></thead>
      <tbody id="vpnLista"><tr><td colspan="14" class="vpn-vazio">Carregando…</td></tr></tbody>
    </table>
  </div>
</main>

<dialog class="vpn-dialogo" id="vpnVer" aria-labelledby="vpnVerTitulo">
  <div class="vpn-dialogo-corpo">
    <h2 id="vpnVerTitulo">Solicitação</h2>
    <dl class="vpn-dados" id="vpnVerDados"></dl>
    <div class="vpn-dialogo-acoes">
      <button type="button" class="vpn-acao" id="vpnVerFechar">Fechar</button>
      <button type="button" class="vpn-acao" id="vpnVerEditar">Editar</button>
      <button type="button" class="vpn-btn" id="vpnVerDoc">Ver documento</button>
    </div>
  </div>
</dialog>

<dialog class="vpn-dialogo" id="vpnEditar" aria-labelledby="vpnEditarTitulo">
  <form id="vpnEditarForm" method="dialog" novalidate>
    <h2 id="vpnEditarTitulo">Editar solicitação</h2>
    <div class="vpn-grade vpn-grade-edit">
      <label class="vpn-largo">Nome completo<input name="nome" type="text" maxlength="120"></label>
      <label>CPF<input name="cpf" type="text" inputmode="numeric" maxlength="14"></label>
      <label>RG<input name="rg" type="text" maxlength="30"></label>
      <label>Data de nascimento<input name="data_nascimento" type="date"></label>
      <label>WhatsApp<input name="whatsapp" type="tel" inputmode="tel" maxlength="15" placeholder="(68) 90000-0000"></label>
      <label class="vpn-largo">E-mail funcional<input name="email_funcional" type="email" maxlength="160" placeholder="nome@ac.gov.br"></label>
      <label>Vínculo<select name="vinculo"><option value="efetivo">Efetivo</option><option value="comissionado">Comissionado</option><option value="terceirizado">Terceirizado</option></select></label>
      <label>Matrícula<input name="matricula" type="text" maxlength="30"></label>
      <label class="vpn-largo">Setor<input name="setor" type="text" maxlength="120"></label>
      <label class="vpn-largo">Observações<textarea name="observacoes" rows="4" maxlength="2000" placeholder="Anotações da equipe sobre esta solicitação"></textarea></label>
    </div>
    <p class="vpn-aviso erro" id="vpnEditarErro" role="alert" hidden></p>
    <div class="vpn-dialogo-acoes">
      <button type="button" class="vpn-acao" id="vpnEditarCancelar">Cancelar</button>
      <button type="submit" class="vpn-btn" id="vpnEditarSalvar">Salvar</button>
    </div>
  </form>
</dialog>
<script src="../js/vpn-equipe.js?v=2026102110"></script>
</body>
</html>
