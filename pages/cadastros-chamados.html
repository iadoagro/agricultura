<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastros auxiliares | Chamados</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="../js/banco-config.js?v=2026091406"></script>
<script src="../js/ambiente-cliente.js?v=2026092302"></script>
<script src="../js/admin-auth.js?v=2026092409"></script>
<script src="../js/admin-gate.js?v=2026092203"></script>
<script src="../js/rastreio.js?v=2026092303"></script>
<script src="../js/nav.js?v=2026092405"></script>
<link rel="stylesheet" href="../css/base.css?v=2026091501">
<link rel="stylesheet" href="../css/chamados-comum.css?v=2026091930">
<link rel="stylesheet" href="../css/chamados.css?v=2026091930">
<link rel="stylesheet" href="../css/motion-ui.css?v=2026091904">
<link rel="stylesheet" href="../css/ui-upgrade.css?v=2026092007">
<link rel="stylesheet" href="../css/fx-ui.css?v=2026092103">
<link rel="stylesheet" href="../css/nav.css?v=2026092404">
</head>
<body class="ch-fila-pagina">
<header class="ch-cab">
  <h1>Cadastros auxiliares</h1>
  <p>Problemas, diretorias, departamentos e setores usados no formulário de abertura de chamados</p>
</header>

<main class="ch-fila">
  <div class="ch-faixa-demo" id="faixaDemo" hidden>
    <b>Modo demonstração.</b> O banco de dados ainda não está configurado: os cadastros ficam salvos só neste navegador.
  </div>

  <nav class="ch-abas-aux" id="abasAux" role="tablist" aria-label="Tipo de cadastro"></nav>

  <div class="ch-aux-grade">
    <section class="ch-cartao-aux" aria-labelledby="tituloNovo">
      <h2 id="tituloNovo"></h2>
      <p class="ch-dica" id="dicaNovo"></p>
      <form id="formNovo" novalidate>
        <div class="ch-campo" id="cPai"></div>
        <div class="ch-campo" id="cCategoria"></div>
        <div class="ch-campo">
          <label for="novoNome">Nome</label>
          <input id="novoNome" type="text" maxlength="120" autocomplete="off">
        </div>
        <p class="ch-erro-msg" id="erroNovo" role="alert"></p>
        <button class="ch-btn primario" type="submit" id="btnAdd">Adicionar</button>
      </form>
      <div class="ch-aux-extra" id="extra"></div>
    </section>

    <section class="ch-cartao-aux lista" aria-label="Cadastros">
      <div class="ch-aux-barra">
        <div class="ch-busca-fila"><span id="icoBusca"></span><input id="buscaAux" type="search" placeholder="Buscar por nome…" autocomplete="off" aria-label="Buscar"></div>
        <select id="filtroPai" aria-label="Filtrar por vínculo"></select>
        <div class="ch-seg" id="segSit" role="group" aria-label="Situação">
          <button type="button" data-v="todos" class="on">Todos</button>
          <button type="button" data-v="ativos">Ativos</button>
          <button type="button" data-v="inativos">Inativos</button>
        </div>
      </div>
      <p class="ch-status-fila" id="contagem" role="status"></p>
      <div class="ch-tabela-rolagem"><table class="ch-tabela" id="tabela"></table></div>
    </section>
  </div>
</main>

<script src="../js/chamados-dados.js?v=2026091930"></script>
<script src="../js/chamados-ui.js?v=2026091930"></script>
<script src="../js/chamados-cadastros.js?v=2026091930"></script>
<script src="../js/motion-ui.js?v=2026091904"></script>
<script src="../js/motion-extras.js?v=2026092001"></script>
<script src="../js/fx-ui.js?v=2026092102" defer></script>
</body>
</html>
