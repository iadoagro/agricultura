  </div>

<script>
/* Carregador do organograma: busca no banco os setores, responsáveis, portarias e histórico
   (antes escritos dentro desta página) e só então roda js/organograma.js. Guarda uma cópia no
   navegador: nas visitas seguintes desenha na hora e, se o banco tiver algo novo, recarrega uma vez. */
window.ORG_PUBLICO=true;   // somente visualização
(function(){
  var CHAVE='seagri_org_dados_v1';
  var cfg=window.BANCO_CONFIG||{};
  var base=String(cfg.url||'').replace(/\/$/,'');
  function lerCache(){
    try{var v=JSON.parse(localStorage.getItem(CHAVE)||'null');return v&&v.setores&&v.setores.length?v:null;}catch(e){return null;}
  }
  function pegar(tabela,consulta){
    return fetch(base+'/rest/v1/'+tabela+'?'+consulta,{headers:{apikey:cfg.chavePublica},cache:'no-store'})
      .then(function(r){if(!r.ok)throw new Error(tabela+': HTTP '+r.status);return r.json();});
  }
  function buscar(){
    return Promise.all([
      pegar('organograma_setores','select=*&order=ordem.asc'),
      pegar('organograma_portarias','select=chave,pdf'),
      pegar('organograma_historico','select=setor_id,nome,portaria,ano,ordem&order=setor_id.asc,ordem.asc')
    ]).then(function(r){
      var d={setores:[],portarias:{},matriculas:{},historico:{}};
      r[0].forEach(function(x){
        d.setores.push([x.id,x.parent_id,x.tipo,x.cor,x.titulo,x.holder||'',Number(x.x),Number(x.y),Number(x.w),Number(x.hh),Number(x.bh)]);
        d.matriculas[x.id]=x.matricula||'';
      });
      r[1].forEach(function(p){d.portarias[p.chave]=p.pdf;});
      r[2].forEach(function(h){(d.historico[h.setor_id]=d.historico[h.setor_id]||[]).push({nome:h.nome,portaria:h.portaria,ano:h.ano});});
      if(!d.setores.length)throw new Error('organograma_setores vazio');
      return d;
    });
  }
  function iniciar(d){
    window.ORG_DADOS=d;
    var s=document.createElement('script');
    s.src='../js/organograma.js?v=2026101704';
    document.body.appendChild(s);
  }
  function falhou(e){
    var p=document.createElement('p');
    p.style.cssText='padding:24px;font:15px Arial;color:#b91c1c';
    p.textContent='Não foi possível carregar o organograma ('+(e&&e.message||'sem conexão')+'). Recarregue a página.';
    document.body.appendChild(p);
  }
  // Modo celular (lista): vale já no primeiro desenho, antes de o organograma.js chegar. A escolha guardada neste
  // aparelho manda; sem ela, telefone (tela estreita, ou deitado com pouca altura) abre em lista.
  try{
    var modo=localStorage.getItem('seagri_org_modo');
    if(modo?modo==='celular':matchMedia('(max-width:700px),(pointer:coarse) and (max-height:520px)').matches)document.body.classList.add('org-celular');
  }catch(e){}
  var cache=lerCache();
  if(cache){
    iniciar(cache);
    buscar().then(function(novo){
      var a=JSON.stringify(novo);
      if(a===JSON.stringify(cache))return;
      try{localStorage.setItem(CHAVE,a);}catch(e){}
      try{
        if(sessionStorage.getItem('seagri_org_dados_reload')===String(a.length))return;
        sessionStorage.setItem('seagri_org_dados_reload',String(a.length));
      }catch(e){}
      location.reload();
    }).catch(function(){});
  }else{
    buscar().then(function(d){
      try{localStorage.setItem(CHAVE,JSON.stringify(d));}catch(e){}
      iniciar(d);
    }).catch(falhou);
  }
})();
</script>
<script src="../js/motion-ui.js?v=2026091904"></script>
<script src="../js/motion-extras.js?v=2026100901"></script>
<script src="../js/fx-ui.js?v=2026092102" defer></script>
